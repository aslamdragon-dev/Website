<!-- The 360, live from the start. It sits under the splash so that entering
     is a camera move rather than a page change. -->
<div class="tour" id="tour">
  <div id="pano" aria-hidden="true"></div>

  <!-- Still frame, framed to exactly match the tour's opening view. Shown
       until the panorama has painted, and kept if WebGL is unavailable. -->
  <div class="tour__poster" id="poster">
    <img src="assets/img/pano-poster-1600.jpg" alt="Aerial view over the Artura estate at Pointe aux Biches, with the beach, lagoon and mountains beyond." fetchpriority="high" width="1600" height="900">
  </div>

  <!-- Boundary shapes are drawn here, redrawn as the view moves. -->
  <svg class="tour__shapes" id="shapes" aria-hidden="true" focusable="false"></svg>

  <!-- Sun glare, tracked to a fixed direction in the panorama. Brightens as
       the visitor turns away from the site and the sun comes into frame. -->
  <div class="sun" id="sun" aria-hidden="true"></div>

  <div class="tour__scrim"></div>
</div>

<!-- The lockup is the page's heading and its opening title card. On entering it
     flies from the centre of the splash onto the site pin and becomes that
     landmark's label, so the brand name and the place on the map are literally
     the same piece of text. -->
<!-- The core is name + tagline, and it is the part that flies onto the pin and
     becomes its label. The place line belongs to the title card only, so it sits
     outside the core and fades as the flight begins. -->
<h1 class="lockup" id="mark">
  <span class="lockup__core">
    <span class="lockup__name">Artura</span>
    <span class="lockup__tag">Resorts &middot; Clubhouse &middot; Concierge</span>
  </span>
  <span class="lockup__place">Pointe aux Biches, Mauritius</span>
</h1>

<!-- Stands in for the wordmark only while the site pin is out of frame, so the
     brand never disappears entirely when the visitor turns away. -->
<p class="cornermark" id="cornerMark" aria-hidden="true">Artura</p>
